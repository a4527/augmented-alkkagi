anchor="start" font-weight="600">HUD·조준</text><text x="318" y="120" class="m" font-size="11.5" text-anchor="start">입력 → 명령</text><rect x="440" y="82" width="124" height="64" rx="8" class="card" /><text x="452" y="102" class="t" font-size="12.5" text-anchor="start" font-weight="600">오디오</text><text x="452" y="120" class="m" font-size="11.5" text-anchor="start">음악·효과음</text><text x="38" y="174" class="lay" font-size="11" text-anchor="start" font-weight="600">GameSession (같은 인터페이스, 모드별 구현)</text><rect x="38" y="184" width="170" height="64" rx="8" class="card" /><text x="50" y="204" class="t" font-size="12.5" text-anchor="start" font-weight="600">RemoteGameSession</text><text x="50" y="222" class="m" font-size="11.5" text-anchor="start">온라인 · Socket.IO</text><rect x="218" y="184" width="170" height="64" rx="8" class="card" /><text x="230" y="204" class="t" font-size="12.5" text-anchor="start" font-weight="600">LocalGameSession</text><text x="230" y="222" class="m" font-size="11.5" text-anchor="start">로컬 2인 · SharedWorker</text><rect x="398" y="184" width="170" height="64" rx="8" class="card" /><text x="410" y="204" class="t" font-size="12.5" text-anchor="start" font-weight="600">AiGameSession</text><text x="410" y="222" class="m" font-size="11.5" text-anchor="start">AI 대전 · Web Worker</text><text x="38" y="276" class="lay" font-size="11" text-anchor="start" font-weight="600">판정 위치</text><rect x="38" y="286" width="170" height="94" rx="8" class="card" /><text x="50" y="306" class="t" font-size="12.5" text-anchor="start" font-weight="600">서버가 판정</text><text x="50" y="324" class="m" font-size="11.5" text-anchor="start">명령을 보내고</text><text x="50" y="340" class="m" font-size="11.5" text-anchor="start">받은 뷰를 그린다</text><rect x="218" y="286" width="350" height="94" rx="8" class="card" /><text x="230" y="306" class="t" font-size="12.5" text-anchor="start" font-weight="600">Worker 안 판정 (서버 없음)</text><text x="230" y="324" class="m" font-size="11.5" text-anchor="start">game-runtime