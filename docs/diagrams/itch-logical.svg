<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="830" viewBox="0 0 1220 830" role="img" aria-label="논리 아키텍처: 브라우저는 화면, 게임 세션 추상화, 워커 판정으로 나뉘고 서버는 진입·보안, 애플리케이션, 경기 진행, 데이터 계층으로 나뉜다. 두 쪽은 shared 패키지의 스키마를 함께 쓴다. itch 때문에 바뀌는 곳은 분홍 점선이다."><style>
