-anchor="start" font-weight="600">게스트 플레이 · itch에서 미정</text><text x="50" y="564" class="m" font-size="11.5" text-anchor="start">DB에 저장하지 않는 사용자. 서버의 "사용자 = 회원 번호" 전제</text><text x="50" y="580" class="m" font-size="11.5" text-anchor="start">(연결 관리·경기·전적 저장)를 바꿔야 한다</text><path d="M168,500 L168,514 L610,514 L610,58 L913,58 L913,80" class="ln" fill="none" marker-end="url(#f4-a)"/><rect x="572.7" y="290.5" width="74.6" height="15.5" rx="3" class="lbbg"/><text x="610" y="300" class="lb" font-size="10.5" text-anchor="middle">HTTPS · WSS</text><rect x="250" y="668" width="720" height="120" rx="10" class="card" /><text x="610" y="694" class="t" font-size="13" text-anchor="middle" font-weight="700">packages/shared</text><text x="610" y="716" class="m" font-size="11.5" text-anchor="middle">Zod 스키마 · 이벤트·오류 코드(프로토콜) · 판·방해요소·물리 상수</text><text x="610" y="736" class="m" font-size="11.5" text-anchor="middle">브라우저와 서버가 같은 스키마로 입력을 검증한다</text><path d="M300,666 L300,632" class="ln" fill="none" marker-end="url(#f4-a)"/><path d="M920,666 L920,632" class="ln" fill="none" marker-end="url(#f4-a)"/><rect x="273.4" y="646.5" width="53.1" height="15.5" rx="3" class="lbbg"/><text x="300" y="656" class="lb" font-size="10.5" text-anchor="middle">가져다 씀</text><rect x="893.4" y="646.5" width="53.1" height="15.5" rx="3" class="lbbg"/><text x="920" y="656" class="lb" font-size="10.5" text-anchor="middle">가져다 씀</text></svg>
