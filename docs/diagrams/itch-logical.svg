.lbbg { fill: #ffffff; } .lb { fill: #1d2430; }
.tile.planned { fill-opacity: 0.45; stroke: #5d6878; stroke-width: 1.4; }
.k-net { fill: #6e44c9; } .k-cpu { fill: #d9622b; } .k-db { fill: #2f55c8; } .k-sto { fill: #2e8540; } .k-saas { fill: #5b6b7a; } .k-chat { fill: #4b5bd7; } .k-git { fill: #3d4650; }
.gl { stroke: #ffffff; stroke-width: 1.8; fill: none; } .glf { fill: #ffffff; } .pp { fill: #5d6878; }
.life { stroke: #aab3c0; stroke-width: 1.2; stroke-dasharray: 3 5; } .num { fill: #1d2430; } .numt { fill: #ffffff; }
.via { fill: #ffffff; stroke: #1d2430; stroke-width: 1.4; }
