418" class="m" font-size="11.5" text-anchor="start">unattended-upgrades</text><text x="648" y="434" class="m" font-size="11.5" text-anchor="start">커널은 수동 재부팅</text><rect x="806" y="380" width="168" height="102" rx="8" class="card" /><text x="818" y="400" class="t" font-size="12.5" text-anchor="start" font-weight="600">systemd 타이머</text><text x="818" y="418" class="m" font-size="11.5" text-anchor="start">일 04:00 전체 백업</text><text x="818" y="434" class="m" font-size="11.5" text-anchor="start">월~토 04:00 차등</text><text x="818" y="450" class="m" font-size="11.5" text-anchor="start">10분마다 보관 확인</text><rect x="280" y="498" width="694" height="300" rx="8" class="box" /><text x="296" y="518" class="m" font-size="11.5" text-anchor="start" font-weight="600">Docker</text><rect x="296" y="530" width="186" height="254" rx="6" class="pub" /><text x="308" y="548" class="pubt" font-size="11" text-anchor="start" font-weight="600">호스트 네트워크</text><rect x="306" y="560" width="166" height="210" rx="8" class="card" /><text x="318" y="580" class="t" font-size="12.5" text-anchor="start" font-weight="600">caddy:2  :443</text><text x="318" y="598" class="m" font-size="11.5" text-anchor="start">Origin CA 인증서</text><text x="318" y="614" class="m" font-size="11.5" text-anchor="start">신뢰 프록시 =</text><text x="318" y="630" class="m" font-size="11.5" text-anchor="start">Cloudflare 대역</text><text x="318" y="646" class="m" font-size="11.5" text-anchor="start">HTTP/1.1·2</text><text x="318" y="662" class="m" font-size="11.5" text-anchor="start">메모리 상한 128MB</text><text x="318" y="678" class="m" font-size="11.5" text-anchor="start">접근 로그 없음</text><rect x="496" y="530" width="464" height="254" rx="6" class="priv" /><text x="508" y="548" class="privt" font-size="11" text-anchor="start" font-weight="600">브리지 네트워크 alkkagi_default</text><rect x="508" y="560" width="214" height="150" rx="8" class="card" /><text x="520" y="580" class="t" font-size="12.5" text-anchor="start" font-weight="600">게임 서버</text><text 