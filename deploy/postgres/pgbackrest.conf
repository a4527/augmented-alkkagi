# pgBackRest 설정(OPS-005). 저장소 위치·키·암호는 컨테이너 환경 변수(PGBACKREST_REPO1_*)로 받고 여기에는 두지 않는다.
[global]
repo1-type=s3
# Cloudflare R2: 지역은 auto, 경로 방식 주소를 쓴다.
repo1-s3-region=auto
repo1-s3-uri-style=path
repo1-path=/pgbackrest
# 백업은 R2에 암호화해 올린다. 암호(PGBACKREST_REPO1_CIPHER_PASS)를 잃으면 복구할 수 없다.
repo1-cipher-type=aes-256-cbc
# 전체 백업(매주) 4개를 남긴다. 그보다 오래된 WAL·차등 백업도 함께 지워진다.
repo1-retention-full=4
compress-type=zst
start-fast=y
process-max=1
log-level-console=info
log-level-file=off

[alkkagi]
pg1-path=/var/lib/postgresql/data
pg1-user=alkkagi
pg1-database=alkkagi
