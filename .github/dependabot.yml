# 의존성 갱신 PR(CI-001). 갱신 PR도 CI 검사를 통과해야 병합된다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 공개 직후의 악성 배포를 피하려고 새 버전은 7일 뒤에 제안받는다.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
